version=6.2.16-SNAPSHOT

org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

kotlinVersion=1.9.25

kotlin.jvm.target.validation.mode=ignore
kotlin.stdlib.default.dependency=false

# 优先使用本地仓库
org.gradle.resolutionstrategy=prefer-local
systemProp.maven.repo.local=C:/Users/pc/.m2/repository

# JDK 17 路径（请根据实际情况修改）
# 如果 JDK 17 安装在其他位置，请修改以下路径
org.gradle.java.home=C:/Users/pc/.jdks/openjdk-24.0.1

nullaway.enabled=false

# 性能优化
#org.gradle.parallel=true
#org.gradle.caching=true
#org.gradle.configuration-cache=false
#org.gradle.daemon=true

# 内存设置
#org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 禁用离线模式以便首次构建下载依赖
